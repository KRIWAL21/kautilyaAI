<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Primary SEO -->
    <title>Roffr — Discover Verified Real Estate Projects, Listings & Channel Partners</title>
    <meta
      name="description"
      content="Roffr is a real-estate marketplace to discover verified projects and homes, compare listings, book site visits and connect with trusted channel partners across India."
    />
    <meta
      name="keywords"
      content="real estate, property in India, new launch projects, ready to move flats, apartments, channel partners, real estate marketplace, Mumbai property, Bilaspur property, RERA approved projects, buy home, site visit booking"
    />
    <meta name="author" content="Brahmaastra" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="rating" content="General" />
    <meta name="distribution" content="Global" />

    <!-- Canonical (UPDATE the host below to match your production origin) -->
    <link rel="canonical" href="https://roffr.com/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roffr" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://roffr.com/" />
    <meta property="og:title" content="Roffr — Real Estate Marketplace" />
    <meta
      property="og:description"
      content="Discover verified projects, compare listings and connect with trusted channel partners on Roffr."
    />
    <meta property="og:image" content="https://roffr.com/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Roffr real estate marketplace" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@roffr_in" />
    <meta name="twitter:creator" content="@roffr_in" />
    <meta name="twitter:domain" content="roffr.com" />
    <meta name="twitter:title" content="Roffr — Real Estate Marketplace" />
    <meta
      name="twitter:description"
      content="Discover verified projects, compare listings and connect with trusted channel partners on Roffr."
    />
    <meta name="twitter:image" content="https://roffr.com/og-cover.jpg" />
    <meta name="twitter:image:alt" content="Roffr real estate marketplace" />

    <!-- Geo / Local SEO -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="ICBM" content="20.5937, 78.9629" />

    <!-- iOS PWA tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Roffr" />

    <!-- Performance hints -->
    <link rel="dns-prefetch" href="//checkout.razorpay.com" />
    <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin />

    <!-- Structured data: Organization + WebSite (sitelinks search box hint) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://roffr.com/#organization",
            "name": "Roffr",
            "url": "https://roffr.com/",
            "logo": "https://roffr.com/logo.png",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://roffr.com/#website",
            "url": "https://roffr.com/",
            "name": "Roffr",
            "description": "Real estate marketplace — verified projects, listings and channel partners.",
            "publisher": { "@id": "https://roffr.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://roffr.com/search?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      You need to enable JavaScript to run Roffr. Roffr is a real-estate
      marketplace for discovering verified projects, listings and channel
      partners across India.
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
